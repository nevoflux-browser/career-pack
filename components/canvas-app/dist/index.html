<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Career Scan</title>
    <style>
      :root {
        --bg: #0f1115;
        --panel: #171a21;
        --border: #262b36;
        --text: #e6e9ef;
        --muted: #9aa4b2;
        --accent: #4f8cff;
        --warn: #e0a500;
        --error: #ff6b6b;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f6f7f9;
          --panel: #ffffff;
          --border: #e3e6ea;
          --text: #1a1d23;
          --muted: #5b6472;
          --accent: #2f6bff;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      #app { max-width: 1100px; margin: 0 auto; padding: 20px; }
      .app-header { display: flex; align-items: center; justify-content: space-between; }
      h1 { font-size: 20px; margin: 0; }
      h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; }
      .scan-btn {
        background: var(--accent); color: #fff; border: 0; border-radius: 8px;
        padding: 9px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
      }
      .scan-btn:disabled { opacity: .5; cursor: default; }
      .stats { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0; }
      .stat { flex: 1 1 90px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
      .stat-value { font-size: 22px; font-weight: 700; }
      .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
      .columns { display: grid; grid-template-columns: 1fr 340px; gap: 16px; }
      @media (max-width: 780px) { .columns { grid-template-columns: 1fr; } }
      .cluster { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
      .cluster-header { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
      .cluster-name { font-weight: 600; }
      .cluster-count { color: var(--muted); font-size: 12px; }
      .job { padding: 8px 12px; border-top: 1px solid var(--border); }
      .job:first-of-type { border-top: 0; }
      .job-title a { color: var(--accent); text-decoration: none; }
      .job-title a:hover { text-decoration: underline; }
      .job-meta { color: var(--muted); font-size: 12px; }
      .badge { font-size: 10px; padding: 1px 6px; border-radius: 999px; font-weight: 600; }
      .badge-repost { background: rgba(224, 165, 0, .18); color: var(--warn); }
      .empty { color: var(--muted); }
      .failed { margin-top: 12px; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
      .failed-title { color: var(--error); font-weight: 600; margin-bottom: 4px; }
      .failed-row { color: var(--muted); font-size: 12px; }
      .log-pane { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px; height: 320px; overflow: auto; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
      .log { white-space: pre-wrap; }
      .log-warn { color: var(--warn); }
      .log-error { color: var(--error); }
      .notice { max-width: 560px; margin: 60px auto; text-align: center; color: var(--muted); }
      .notice h1 { color: var(--text); margin-bottom: 8px; }
    </style>
  <script type="module" crossorigin src="./index-cb62m2fa.js"></script></head>
  <body>
    <div id="app"></div>
    
  </body>
</html>
