[pack]
name = "career-pack"
namespace = "career"
version = "0.1.0"
protocol = "pack-protocol/0.1"
min_nevoflux = "0.3.0"
description = "AI-native career copilot pack: scan, evaluate, outreach, research, portfolio & training skills."
license = "MIT"

[components.skills]
dir = "components/skills"

[components.canvas_tools]
files = ["components/canvas-tools/pdf-render.toml"]
external_binaries = ["weasyprint"]

[components.dashboard]
artifact_id = "career-pack-scan"
content_type = "project"
files_from = "components/canvas-app/dist"
entry = "index.html"

# Seeded only when the page is absent (idempotent); every seed slug is covered
# by [components.protected] below, so uninstall never deletes user data.
[[components.seed]]
slug = "career/cv"
from = "components/seed/cv.template.md"

[[components.seed]]
slug = "career/profile"
from = "components/seed/profile.template.md"

[[components.seed]]
slug = "career/applications"
from = "components/seed/applications.template.md"

[components.protected]
slugs = [
  "career/cv", "career/profile", "career/applications", "career/scan-history",
]
prefixes = [
  "career/reports/", "career/companies/", "career/projects/", "career/training/",
]
